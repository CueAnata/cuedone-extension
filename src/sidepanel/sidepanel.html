<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CueDone</title>
    <link rel="stylesheet" href="../shared/styles.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="sidepanel-view">
    <header class="app-header">
      <img
        class="logo-mark"
        src="../../icons/icon48.png"
        alt=""
        width="40"
        height="40"
      />
      <div class="brand-text">
        <h1>CueDone</h1>
        <p class="tagline">See it. Do it. CueDone.</p>
      </div>
      <div class="view-switch" role="group" aria-label="CueDone view">
        <button type="button" class="view-switch-button" data-view="top">
          Top
        </button>
        <button type="button" class="view-switch-button" data-view="side">
          Side
        </button>
      </div>
    </header>
    <main id="app" class="app-main"></main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
