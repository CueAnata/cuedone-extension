name: Build and publish Personal VR to Pages

on:
  push:
    branches: [vr-personal-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vr-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/meta-iwsdk/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: prototypes/meta-iwsdk
      - run: npm run build
        working-directory: prototypes/meta-iwsdk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/meta-iwsdk/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish built VR app
        id: deployment
        uses: actions/deploy-pages@v4
