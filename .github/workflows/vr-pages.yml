name: Build and publish CueDone to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuedone-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build standalone CueDone app
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          # Root standalone index.html is the fully featured app (with src/shared/task-list.js, styles.css, celebrations.js)
          cp index.html dist/index.html
          cp -r src dist/src
          cp -r icons dist/icons 2>/dev/null || true
          # Also copy assets if present (for audio etc.)
          cp -r assets dist/assets 2>/dev/null || true
          echo "=== dist structure ==="
          ls -R dist | head -n 60
          echo "=== dist/index.html head ==="
          head -n 25 dist/index.html
          echo "=== check lattice continuous ==="
          grep -q "background-repeat: repeat" dist/src/shared/styles.css && echo "continuous lattice OK" || echo "MISSING repeat"
          grep -q "grid-template-rows: 72px" dist/src/shared/styles.css && echo "BAD has fixed rows" || echo "GOOD no fixed rows"
          echo "=== check browser web fallback ==="
          grep -q "webGetLocal" dist/src/platform/browser.js && echo "web fallback present" || echo "missing"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish standalone CueDone app
        id: deployment
        uses: actions/deploy-pages@v4
